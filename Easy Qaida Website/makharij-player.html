<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makharij Player</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--gold:#FFC83D;--air:#FF8A3D;--nose:#4ADE80}
*{box-sizing:border-box}
html,body{margin:0;background:#0d1012;color:#fff;font-family:'Source Sans 3',sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px}
.W{width:min(96vw,calc((100vh - 250px)*16/9))}
.views{display:flex;gap:8px;justify-content:center}
.views[hidden]{display:none}
.views button{font:inherit;font-weight:800;font-size:14px;border:1.5px solid #2c3d35;border-radius:999px;padding:5px 14px;cursor:pointer;background:#14201b;color:#cfe0d6}
.views button.on{background:#C9A227;border-color:#C9A227;color:#0B3D2E}
.stage{position:relative;aspect-ratio:16/9;background:#111;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.cam{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
.stage video,.stage img.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lbl{font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.65)}
.dot{fill:#fff;stroke:rgba(255,255,255,.35)}
.lead{stroke:#fff;opacity:.9}
.lbl.gold{fill:var(--gold)}
.ring{fill:none;stroke:var(--gold);transform-box:fill-box;transform-origin:center;animation:ring 1.4s ease-out infinite}
.core{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.6);opacity:0}}
.glow{fill:rgba(255,200,61,.25);stroke:var(--gold);animation:gl 1.1s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.45}to{opacity:1}}
.flow{fill:none;stroke-linecap:round;opacity:.95;animation:dash .9s linear infinite}
.flow.air{stroke:var(--air);filter:drop-shadow(0 0 5px var(--air))}
.flow.nose{stroke:var(--nose);filter:drop-shadow(0 0 5px var(--nose))}
@keyframes dash{to{stroke-dashoffset:-48}}
.puff{fill:var(--air);opacity:0;transform-box:fill-box;transform-origin:center}
.on .puff{animation:puff 1.2s ease-out infinite}
.puffF{fill:var(--air);opacity:0;transform-box:fill-box;transform-origin:center}
.on .puffF{animation:puffF 1.3s ease-out infinite}
@keyframes puffF{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}
.hum{fill:none;stroke:var(--nose);transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 5px var(--nose));animation:ring 1.2s ease-out infinite}
.zone{fill:rgba(255,200,61,.38);stroke:var(--gold);filter:drop-shadow(0 0 7px var(--gold));animation:gl 1s ease-in-out infinite alternate}
.band{fill:none;stroke:rgba(255,200,61,.6);stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px var(--gold));animation:gl 1s ease-in-out infinite alternate}
svg .ar{font-family:'Noto Naskh Arabic',serif}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-30px,2px) scale(1.6)}}
.wave{fill:none;stroke:#fff;stroke-linecap:round;opacity:0}
.on .wave{animation:wave 1s ease-out infinite}
@keyframes wave{0%{opacity:.9;transform:translate(0,0)}100%{opacity:0;transform:translate(-26px,0)}}
.arrow{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--gold));animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%{opacity:.25;transform:translate(0,0)}60%{opacity:1}100%{opacity:0;transform:translate(var(--nx),var(--ny))}}
.layer{opacity:0;transition:opacity .45s}
.layer.on{opacity:1}
.big{position:absolute;left:3.5%;bottom:5%;text-align:center;pointer-events:none;min-width:14%}
.big .ar{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(11vh,100px);line-height:1.1;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.85)}
.big .en{font-family:'Montserrat',sans-serif;font-weight:800;font-size:min(2.8vh,22px);letter-spacing:.06em;color:var(--gold);margin-top:4px}
.step{position:absolute;left:3%;top:5%;max-width:42%;background:rgba(11,61,46,.92);border:1.5px solid rgba(255,200,61,.6);border-radius:14px;padding:9px 15px;font-size:min(2.4vh,19px);font-weight:700;line-height:1.35;transition:opacity .3s}
.step b{color:var(--gold)}
.ar{font-family:'Noto Naskh Arabic',serif;font-style:normal;font-weight:700}
.ar .ar{font-size:1em!important}
.step .ar{font-size:1.25em}
.legend{position:absolute;right:2.5%;top:5%;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:min(1.8vh,14px);font-weight:700}
.legend span{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px}
.legend i{width:24px;height:6px;border-radius:3px;display:inline-block}
.about{background:#14201b;border:1px solid #24382f;border-radius:14px;padding:11px 18px;font-size:16px;line-height:1.5;color:#e6efe9}
.about h3{margin:0 0 3px;font-family:'Montserrat',sans-serif;font-size:14px;letter-spacing:.05em;color:var(--gold);text-transform:uppercase}
.about h3 .ar{font-size:1.4em;text-transform:none;letter-spacing:0}
.about p{margin:0 0 3px}
.about .ar{font-size:1.25em}
.about .book{color:#b9cbc1;font-style:italic}
.about b{color:#fff}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctl button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:12px;padding:8px 16px;cursor:pointer;background:#22303a;color:#fff}
.ctl button.pri{background:#098A46}
.ctl button.on{background:#C9A227;color:#0B3D2E}
body.embed{background:transparent}
body.embed .wrap{padding:0;gap:6px;min-height:100vh}
body.embed .W{width:min(100vw,calc((100vh - 215px)*16/9))}
body.embed .stage{border-radius:14px}
body.embed .about{padding:6px 12px;font-size:13.5px;line-height:1.35}
body.embed .about h3{font-size:12px;margin-bottom:1px}
body.embed .ctl button{padding:6px 12px;font-size:13px}
body.embed .views button{padding:3px 12px;font-size:13px}
@media (max-width:600px){
  .step{font-size:11px;padding:5px 8px;max-width:50%;border-radius:10px;border-width:1px}
  .legend{font-size:9.5px;gap:3px;right:2%;top:4%}
  .legend span{padding:2px 7px;gap:5px}
  .legend i{width:14px;height:4px}
  .big{left:2.5%;bottom:3%}
  .big .ar{font-size:40px}
  .big .en{font-size:11px}
  .about{font-size:14px;padding:8px 12px}
  .ctl button{padding:7px 12px;font-size:14px}
}
@media (max-height:430px){
  body.embed .about{display:none}
  body.embed .W{width:min(100vw,calc((100vh - 84px)*16/9))}
  body.embed .wrap{gap:4px}
  .step{font-size:11px;padding:4px 8px}
  .legend{font-size:9.5px}
  .big .ar{font-size:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="views W" id="views" hidden></div>
  <div class="stage W" id="stage">
    <div class="cam" id="cam">
      <img class="still" id="still" alt="">
      <video id="vid" muted playsinline preload="auto"></video>
      <svg id="ov" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    </div>
    <div class="step" id="step"></div>
    <div class="legend" id="legend"></div>
    <div class="big"><div class="ar" id="bigAr"></div><div class="en" id="bigEn"></div></div>
  </div>
  <div class="about W" id="about"></div>
  <div class="ctl">
    <button class="pri" id="bPlay">❚❚ Pause</button>
    <button id="bAgain">↻ Again</button>
    <button id="bSlow">🐢 Slow</button>
    <button class="on" id="bOv">Labels &amp; airflow: on</button>
  </div>
</div>

/* ============ which letter / group ============ */
const q=new URLSearchParams(location.search);
if(q.get("embed")) document.body.classList.add("embed");
const POS=P[q.get("z")]?q.get("z"):POS_OF[LET[q.get("l")]?q.get("l"):"fa"];
const LID=LET[q.get("l")]&&POS_OF[q.get("l")]===POS?q.get("l"):null;           // one letter, or the whole group
const GROUP=Object.keys(POS_OF).filter(k=>POS_OF[k]===POS);
const C=Object.assign({},P[POS]); C.views=C.views.filter(v=>!v.for||v.for.includes(LID||GROUP[0]));
const GAR=GROUP.map(k=>LET[k][0]).join(" ");
const SAY=LID?LET[LID][0]:GAR;
const nasal=LID?GHUNNAH.has(LID):false;

const $=id=>document.getElementById(id);
const bidi=h=>h.replace(/[\u0600-\u06FF]+(?:[\s:]+[\u0600-\u06FF]+)*/g,m=>`<bdi class="ar">${m}</bdi>`);
const NS="http://www.w3.org/2000/svg";
const el=(tag,a,parent)=>{ const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); if(parent) parent.appendChild(e); return e; };
function curve(pts){ let d=`M${pts[0][0]} ${pts[0][1]}`; for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`; } return d; }

/* ============ text below + the big letter ============ */
$("bigAr").textContent=SAY; $("bigEn").textContent=LID?LET[LID][1].toUpperCase():"";
$("about").innerHTML=`<h3>The makhraj of <span class="ar">${GAR}</span>${LID&&GROUP.length>1?` &nbsp;·&nbsp; ${LET[LID][1]} shares it with <span class="ar">${GROUP.filter(k=>k!==LID).map(k=>LET[k][0]).join(" ")}</span>`:""}</h3>
 <p class="book">From the book: “${bidi(C.book)}”</p>
 <p>${bidi(C.how)}</p>`;

/* ============ one view = one picture / video + its overlay ============ */
let V=null, VI=0, STEPS=[];
function defaultSteps(v){ return [[0,"Watch closely…",{anat:1}],[0.9,v.move,{zoom:1,zl:1,up:1}],
  [2.2,`${v.touch} This is the makhraj of <span class="ar">${SAY}</span>.`,{zoom:1,zl:1,mk:1}],
  [2.8,`${v.airText}${nasal?" The sound also hums <b>through the nose</b>.":""}`,{zoom:1,zl:1,mk:1,air:1}],
  [5.4,"Back to rest.",{}],[6.3,`Your turn: say <span class="ar">${SAY}</span>.`,{anat:1}]]; }
function drawLabels(g,list,s){ list.forEach(([t,x,y,lx,ly,gold])=>{
  el("line",{x1:x,y1:y,x2:lx,y2:ly,class:"lead","stroke-width":2.2*s,style:gold?"stroke:#FFC83D":""},g);
  if(!gold) el("circle",{cx:x,cy:y,r:5.5*s,class:"dot","stroke-width":6*s},g);
  const right=lx>x+8, left=lx<x-8;
  const tx=el("text",{x:lx+(right?5*s:left?-5*s:0),y:ly+(ly>y?24*s:-8*s),class:"lbl"+(gold?" gold":""),"text-anchor":right?"start":left?"end":"middle","font-size":24*s,"stroke-width":6*s},g);
  t.split(/([\u0600-\u06FF]+)/).forEach(part=>{ if(!part) return; const sp=el("tspan",/[\u0600-\u06FF]/.test(part)?{class:"ar"}:{},tx); sp.textContent=part; }); }); }
function drawPoint(g,[x,y],s){ el("circle",{cx:x,cy:y,r:16*s,class:"ring","stroke-width":8*s},g); el("circle",{cx:x,cy:y,r:16*s,class:"ring","stroke-width":8*s,style:"animation-delay:.7s"},g); el("circle",{cx:x,cy:y,r:7*s,class:"core"},g); }
function drawArrow(g,[x0,y0,x1,y1],s){ const a=Math.atan2(y1-y0,x1-x0), h=11*s, w=Math.PI/5;
  const p=el("path",{d:`M${x0} ${y0} L${x1} ${y1} M${x1-h*Math.cos(a-w)} ${y1-h*Math.sin(a-w)} L${x1} ${y1} L${x1-h*Math.cos(a+w)} ${y1-h*Math.sin(a+w)}`,class:"arrow","stroke-width":4*s},g);
  p.style.setProperty("--nx",`${Math.cos(a)*12*s}px`); p.style.setProperty("--ny",`${Math.sin(a)*12*s}px`); }
function buildView(i){
  VI=i; V=C.views[i]; STEPS=typeof V.steps==="function"?V.steps():V.steps||defaultSteps(V); cur=null;
  const ov=$("ov"); ov.innerHTML=""; const G={};
  for(const k of ["anat","air","zl","zl2","up","up2","mk","mk2"].concat(Object.keys(V.extra||{}))) G[k]=el("g",{class:"layer","data-k":k},ov);
  const s1=1/(V.zoom?V.zoom[2]:1), s2=1/(V.zoom2?V.zoom2[2]:1);
  (V.anat||SIDE_ANAT).forEach(([t,x,y,lx,ly])=>{ el("line",{x1:x,y1:y,x2:lx,y2:ly,class:"lead","stroke-width":1.8},G.anat); el("circle",{cx:x,cy:y,r:6,class:"dot","stroke-width":6},G.anat);
    el("text",{x:lx,y:ly+(ly>y?24:-9),class:"lbl","text-anchor":"middle","font-size":22,"stroke-width":5},G.anat).textContent=t; });
  drawLabels(G.zl,V.labels||[],s1); drawLabels(G.zl2,V.labels2||[],s2);
  for(const k in V.extra||{}){ const e=V.extra[k]; if(e.svg) G[k].innerHTML=typeof e.svg==="function"?e.svg():e.svg; drawLabels(G[k],e.labels||[],s1); }
  (V.arrows||[]).forEach(a=>drawArrow(G.up,a,s1));
  if(V.arrow) drawArrow(G.up,V.arrow,s1); if(V.arrow2){ drawArrow(G.up2,V.arrow2,s2); drawArrow(G.up2,V.arrow,s2); }
  if(V.glow) el("ellipse",{cx:V.glow[0],cy:V.glow[1],rx:V.glow[2],ry:V.glow[3],class:"glow","stroke-width":3*s1},G.mk);
  if(V.point) drawPoint(G.mk,V.point,V.point2?s2:s1); if(V.point2) drawPoint(G.mk2,V.point2,s2);
  if(V.air){ const pts=THROAT.concat(V.air), dash=`${28*s1} ${20*s1}`;
    el("path",{d:curve(pts),class:"flow air","stroke-width":11*s1,"stroke-dasharray":dash},G.air);
    if(nasal) el("path",{d:curve(NOSE),class:"flow nose","stroke-width":11*s1,"stroke-dasharray":dash},G.air);
    const e=pts[pts.length-1];
    if(!V.stop) for(let k=0;k<3;k++) el("circle",{cx:e[0],cy:e[1],r:14*s1,class:"puff",style:`animation-delay:${k*.4}s`},G.air);
    if(V.whistle) for(let k=0;k<3;k++) el("path",{d:`M${e[0]-6*s1} ${e[1]-12*s1} q ${-5*s1} ${5*s1} 0 ${11*s1} q ${5*s1} ${5*s1} 0 ${11*s1}`,class:"wave","stroke-width":2.4*s1,style:`animation-delay:${k*.33}s`},G.air); }
  $("legend").innerHTML=typeof V.legend==="function"?V.legend():V.legend==="front"?`<span><i style="background:var(--gold);height:12px;width:12px;border-radius:50%"></i>Makhraj (where the tongue presses)</span>`
    :`<span><i style="background:var(--air)"></i>Air through the mouth</span>${nasal?'<span><i style="background:var(--nose)"></i>Hum through the nose (ghunnah)</span>':""}<span><i style="background:var(--gold);height:12px;width:12px;border-radius:50%"></i>Makhraj (where it is said)</span>`;
  [...$("views").children].forEach((b,j)=>b.classList.toggle("on",j===i));
  // picture / video
  const still=$("still"), vid=$("vid"); hasVideo=false; still.src=V.still||HEAD; still.style.display="";
  vid.pause(); vid.removeAttribute("src"); vid.load(); vid.style.display="none";
  vid.dataset.alt=""; const vm=document.getElementById("vmsg"); if(vm) vm.remove();
  if(V.video){ vid.src=pickSrc(V.video); vid.playbackRate=slow?.5:1; vid.load(); }
  t0=performance.now(); paused=false; $("bPlay").textContent="❚❚ Pause";
}
/* zoom: scale around the point of interest so it lands in the middle */
function camTransform(z){ if(!z||z[2]===1) return z?`translate(${(0.5-z[0]/1376)*0}%,0) scale(1)`:"none"; const fx=z[0]/1376, fy=z[1]/768, s=z[2];
  const tx=Math.max(Math.min((0.5-fx)*s,(s-1)/2),-(s-1)/2)*100/s, ty=Math.max(Math.min((0.5-fy)*s,(s-1)/2),-(s-1)/2)*100/s;
  return `scale(${s}) translate(${tx}%, ${ty}%)`; }

/* ============ timeline ============ */
const vid=$("vid"); let ovOn=true, slow=false, t0=performance.now(), hasVideo=false, paused=false, pauseAt=0, cur=null;
const LEN=7.5;
function setStep(s){ if(s===cur) return; cur=s; const f=s[2]; $("step").innerHTML=bidi(s[1]);
  for(const g of $("ov").children) g.classList.toggle("on",ovOn&&!!f[g.dataset.k]);
  $("cam").style.transform=camTransform(f.zoom?V.zoom:f.zoom2?V.zoom2:null); }
function clock(){ return paused?pauseAt:((performance.now()-t0)/1000*(slow?.5:1)); }
function nextView(){ buildView((VI+1)%C.views.length); }
function tick(){
  let t;
  if(hasVideo) t=vid.currentTime;
  else { t=clock(); if(t>=LEN+0.6){ if(C.views.length>1) nextView(); else t0=performance.now(); t=0; } }
  let s=STEPS[0]; for(const x of STEPS) if(t>=x[0]) s=x; setStep(s); }
vid.addEventListener("loadeddata",()=>{ if(!V.video) return; hasVideo=true; vid.style.display=""; $("still").style.display="none"; if(!paused) vid.play().catch(()=>{}); });
vid.addEventListener("error",()=>{ hasVideo=false; if(!V||!V.video||!vid.getAttribute("src")) return;
  /* this computer could not play the first format: try the other one once, then say so clearly */
  if(!vid.dataset.alt&&/\.mp4$/.test(V.video)&&!/^blob:/.test(vid.src)){ vid.dataset.alt="1"; vid.src=/\.webm$/.test(vid.src)?V.video:V.video.replace(/\.mp4$/,".webm"); vid.load(); return; }
  if(!document.getElementById("vmsg")){ const m=document.createElement("div"); m.id="vmsg";
    m.style.cssText="position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(229,72,77,.92);color:#fff;font-weight:700;font-size:min(2.3vh,18px);padding:8px 16px;border-radius:12px;z-index:5;text-align:center;max-width:90%";
    m.textContent="This browser could not play the video. Please open it in Google Chrome or Microsoft Edge (updated)."; $("stage").appendChild(m); } });
vid.addEventListener("ended",()=>{ setTimeout(()=>{ if(C.views.length>1) nextView(); else { vid.currentTime=0; vid.play(); } },900); });
if(C.views.length>1){ const vb=$("views"); vb.hidden=false; vb.innerHTML=C.views.map((v,i)=>`<button data-i="${i}">${i+1}. ${v.name}</button>`).join(""); vb.onclick=e=>{ const b=e.target.closest("button"); if(b) buildView(+b.dataset.i); }; }
$("bPlay").onclick=()=>{ if(hasVideo){ if(vid.paused) vid.play(); else vid.pause(); paused=vid.paused; }
  else if(paused){ t0=performance.now()-pauseAt*1000/(slow?.5:1); paused=false; } else { pauseAt=clock(); paused=true; }
  $("bPlay").textContent=paused?"▶ Play":"❚❚ Pause"; };
$("bAgain").onclick=()=>buildView(0);
$("bSlow").onclick=()=>{ const t=clock(); slow=!slow; if(!paused) t0=performance.now()-t*1000/(slow?.5:1); vid.playbackRate=slow?.5:1; $("bSlow").classList.toggle("on",slow); };
$("bOv").onclick=()=>{ ovOn=!ovOn; cur=null; $("step").style.opacity=ovOn?1:0; $("bOv").classList.toggle("on",ovOn); $("bOv").innerHTML="Labels &amp; airflow: "+(ovOn?"on":"off"); };
buildView(0);
setInterval(tick,50); tick();
</script>
</body>
