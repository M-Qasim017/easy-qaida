<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C3B2C">
<title>eQaida Part 2 — Interactive</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="practice.css?v=1116220000" rel="stylesheet">
<style>
@page{size:148mm 210mm;margin:0}
:root{
  --green:#098A46;--deep:#0B3D2E;--gold:#C9A227;--cream:#FAF6EE;--ink:#2B2A26;--muted:#6E6A60;--rule:#2F2D28;--paper:#FFFDF7;
  --P:#D2186E;--B:#1A84C6;--G:#2A9443;--R:#CF3A2C;
  --S:#1C6FD1;--M:#0E8A43;--E:#D6336C;--A:#7048E8;
  --hf:#E03131;--hk:#1971C2;--hd:#2F9E44;--hs:#7048E8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;color:var(--ink);font-size:10.6pt;line-height:1.36;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:148mm;height:210mm;position:relative;overflow:hidden;background:var(--cream);page-break-after:always;break-after:page}
#book>.pgw:last-child>.page,#book>.page:last-child{page-break-after:auto;break-after:auto}
.frame{position:absolute;inset:4.5mm;border:.8mm solid var(--deep);border-radius:3mm;pointer-events:none}
.frame::after{content:"";position:absolute;inset:1mm;border:.3mm solid var(--gold);border-radius:2mm}
.hdr{position:absolute;top:7.6mm;left:9mm;right:9mm;height:7mm;display:flex;align-items:center;gap:2mm}
.hdr .pill{flex:1;background:var(--deep);color:#FAF6EE;font-family:'Montserrat',sans-serif;font-weight:700;font-size:7pt;letter-spacing:.05em;text-align:center;border-radius:1.5mm;padding:1.25mm 0}
.hdr .no{min-width:10mm;height:10mm;padding:0 1.5mm;border-radius:5mm;background:var(--cream);border:.5mm solid var(--gold);display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:10.5pt;color:var(--deep)}
.body{position:absolute;top:18.5mm;left:10mm;right:10mm;bottom:9.5mm;display:flex;flex-direction:column;font-size:12.6pt;line-height:1.38}
.body.compact{font-size:10.6pt;line-height:1.36}
.body.mid{font-size:11.4pt}
p{margin:0}

/* text */
.qa{margin:0 0 2.2mm}
.q,.a{display:flex;align-items:baseline}
.q{font-weight:700;color:var(--deep)}
.q>span:last-child,.a>span:last-child{flex:1;min-width:0}
.l{flex:none;width:5.2mm;font-family:'Montserrat',sans-serif;font-weight:800;color:var(--green)}
.a .l{color:var(--gold)}
.a{margin-top:.3mm}
.ind{padding-left:5.2mm}
.ar{font-family:'Noto Naskh Arabic',serif;font-weight:700;direction:rtl;unicode-bidi:isolate;font-size:1.38em;line-height:1}
.arl{font-family:'Noto Naskh Arabic',serif;font-weight:700;direction:rtl;font-size:16pt;line-height:1.75;text-align:right;margin:0 0 1.4mm;word-spacing:.6mm}
.mx{margin:0 0 2.4mm}
.title{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--deep);text-align:center;font-size:14pt;line-height:1.2}
.subt{font-style:italic;text-align:center;color:var(--deep);font-size:10.5pt;margin-top:.6mm}
.note-h{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--green)}
.rel{font-family:'Amiri',serif;font-weight:700;direction:rtl;text-align:center;color:var(--deep);font-size:19.5pt;line-height:2.15}
.tr{font-size:12pt;text-align:left;margin:.5mm 0 3mm}
.kh{display:block;margin:2.6mm auto 0;width:max-content;background:var(--deep);color:var(--gold);font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:.08em;font-size:9.6pt;padding:1.3mm 5mm;border-radius:2mm}
.orn{text-align:center;color:var(--gold);font-size:13pt;letter-spacing:2mm;margin-top:3mm}

/* lesson banner */
.lesson{display:flex;align-items:center;justify-content:center;margin:2.4mm 0 2.2mm}
.lw{background:var(--deep);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:9.6pt;padding:1.3mm 5mm 1.3mm 4mm;border-radius:2mm 0 0 2mm;letter-spacing:.07em;text-transform:uppercase}
.ln{width:9.5mm;height:9.5mm;border-radius:50%;background:var(--gold);color:var(--deep);font-family:'Montserrat',sans-serif;font-weight:800;font-size:13pt;display:grid;place-items:center;margin:0 -1.6mm;position:relative;z-index:1;border:.7mm solid var(--cream)}
.lt{background:var(--green);color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:9.6pt;padding:1.3mm 4mm 1.3mm 5mm;border-radius:0 2mm 2mm 0}

/* progress markers (as in the book) */
.mk{display:inline-grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;font-size:5.6pt;line-height:1;vertical-align:middle;margin-left:.8mm}
.mk.g{width:4.3mm;height:4.3mm;border-radius:50%;background:#2E8B3E}
.mk.b{width:5mm;height:4.4mm;background:#2F7FD1;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:1.3mm}
.mk.r{width:4mm;height:4mm;background:#D63939}
.mks{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.4mm;z-index:3;line-height:1}
.mks .mk{margin:0}
.mks.L{left:-2.6mm;top:50%;transform:translateY(-50%)}
.mks.R{right:-2.6mm;top:50%;transform:translateY(-50%)}
.mks.TL{left:-1.6mm;top:-1.8mm;flex-direction:row}
.mks.TR{right:-1.6mm;top:-1.8mm;flex-direction:row}

/* grids */
.grid{display:grid;direction:rtl;gap:.4mm;background:var(--rule);border:.4mm solid var(--rule);grid-auto-rows:1fr}
.cell{background:var(--paper);position:relative;min-width:0}
.cell.empty{background:var(--cream)}
.lc .un{position:absolute;top:.4mm;left:1.3mm;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:8.6pt;line-height:1.5}
.lc .bg{position:absolute;right:2mm;top:46%;transform:translateY(-50%);font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:29pt;line-height:1}
.lc .en{position:absolute;left:1.3mm;bottom:.5mm;font-weight:700;font-size:8.2pt;color:var(--ink)}
.cc{display:flex;flex-direction:column;align-items:center;justify-content:center}
.cc .w{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:20pt;line-height:1.3;display:flex;direction:rtl}
.cc .w span{white-space:pre}
.cc .sm{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:7.6pt;line-height:1.1;direction:rtl;word-spacing:1.2mm;margin-top:-.6mm}
.cc .cap{font-family:'Noto Naskh Arabic',serif;font-weight:600;font-size:6.6pt;color:var(--R);direction:rtl;line-height:1.2}
.hc .hg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:23pt;line-height:1}
.hc .hg.base{color:#1F1E1B}
.wc{display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:18.5pt;line-height:1;color:#1F1E1B}
.label{background:var(--deep);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:8pt;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 1.5mm;line-height:1.2}
.lets{display:flex;align-items:center;justify-content:space-evenly;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:19pt;line-height:1;direction:rtl}
.mtab{display:grid;direction:rtl;gap:.4mm;background:var(--rule);border:.4mm solid var(--rule)}
.mtab .cell{display:flex;align-items:center;justify-content:space-evenly;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:19pt;line-height:1.55;direction:rtl}
.t1{display:grid;grid-template-columns:1fr 22mm;direction:rtl;gap:.4mm;background:var(--rule);border:.4mm solid var(--rule);margin:2.4mm 0 1.6mm}
.t1 .cell{display:flex;align-items:center;justify-content:center;padding:0 1.5mm}
.t1 .k{font-family:'Noto Naskh Arabic',serif;font-weight:700;color:var(--R);font-size:13pt;line-height:1.9}
.t1 .v{font-family:'Amiri',serif;font-weight:700;color:var(--B);font-size:13.4pt;line-height:2;direction:rtl}

/* new exercise pages */
.new{display:inline-block;background:var(--gold);color:var(--deep);font-family:'Montserrat',sans-serif;font-weight:800;font-size:7.4pt;letter-spacing:.1em;padding:.8mm 2.4mm;border-radius:1.2mm;text-transform:uppercase}
.exh{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--deep);font-size:13.6pt;line-height:1.15;margin-top:1.4mm}
.exs{color:var(--muted);font-size:9.8pt;margin-top:.6mm}
.hand{color:var(--gold)}
.g4{display:flex;direction:rtl;gap:2mm;margin:2.4mm 0 1.2mm}
.sb{flex:1;background:#fff;border:.35mm solid #D9D1BC;border-radius:2.4mm;overflow:hidden;text-align:center;direction:ltr}
.sb .gl{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:27pt;line-height:1.55;display:flex;justify-content:center;direction:rtl}
.sb .lb{color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:7.6pt;padding:.9mm 0;letter-spacing:.05em;text-transform:uppercase}
.c-S{color:var(--S)}.c-M{color:var(--M)}.c-E{color:var(--E)}.c-A{color:var(--A)}
.b-S{background:var(--S)}.b-M{background:var(--M)}.b-E{background:var(--E)}.b-A{background:var(--A)}
.box{background:#fff;border:.35mm solid #D9D1BC;border-left:1.2mm solid var(--gold);border-radius:2mm;padding:2mm 2.6mm;margin-top:2mm}
.box b{color:var(--deep)}
.tip{background:#FFF6DB;border:.3mm solid #F0DFA6;border-radius:2mm;padding:1.6mm 2.4mm;margin-top:2mm;font-size:9.6pt}
.tip b{color:#8A6A0C}
.ew{display:flex;align-items:center;justify-content:center;gap:3mm;direction:rtl;margin-top:1.6mm}
.ew .wd{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:30pt;line-height:1.4;display:flex;direction:rtl}
.ew .eq{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--gold);font-size:14pt}
.ew .pcs{display:flex;gap:2.4mm;direction:rtl}
.ew .pc{display:flex;flex-direction:column;align-items:center;background:#fff;border:.35mm solid #D9D1BC;border-radius:2mm;padding:0 2mm .8mm}
.ew .pc .gl{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:22pt;line-height:1.45;display:flex;direction:rtl}
.ew .pc small{font-size:7.4pt;font-weight:700;line-height:1.1}
.njrow{display:flex;direction:rtl;gap:1.6mm;margin-top:1.4mm;flex-wrap:wrap;justify-content:center}
.nj{background:var(--paper);border:.3mm solid #D9D1BC;border-radius:1.6mm;padding:0 2mm;text-align:center;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:17pt;line-height:1.5;display:flex;gap:1.5mm;align-items:center;direction:rtl}
.nj .d{color:#B8B09E}
.legend{display:flex;direction:rtl;gap:1.6mm;flex-wrap:wrap;justify-content:center;margin-top:1.4mm}
.legend span{color:#fff;font-weight:700;font-size:7.6pt;padding:.5mm 2.2mm;border-radius:99px}
.st{display:grid;grid-template-columns:23mm repeat(4,1fr) 24mm;direction:rtl;gap:.35mm;background:#CFC6B2;border:.35mm solid #CFC6B2;margin-top:2mm;flex:1;grid-auto-rows:auto}
.st .th{background:var(--deep);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:7pt;text-align:center;padding:1.2mm .5mm;letter-spacing:.04em;text-transform:uppercase;direction:ltr}
.st .th.S{background:var(--S)}.st .th.M{background:var(--M)}.st .th.E{background:var(--E)}.st .th.A{background:var(--A)}
.st .td{background:#fff;display:flex;align-items:center;justify-content:center;min-height:0}
.st .nm{flex-direction:column;direction:ltr;gap:0}
.st .nm .ar{font-size:15pt;line-height:1.25}
.st .nm b{font-size:8.2pt;color:var(--deep);line-height:1.1}
.st .gl{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:20pt;line-height:1.5;display:flex;direction:rtl}
.st .same{flex-direction:column;gap:0}
.st .same small{font-size:6.4pt;color:var(--muted);font-weight:700;line-height:1;margin-top:-1mm}
.st .na{color:#B8B09E;font-size:9pt}
.st .exw{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:16pt;line-height:1.5;display:flex;direction:rtl}
.st .exw .dim{color:#BDB5A3}
.st .td.ex{flex-direction:column}
.st .td.ex small{font-size:6.2pt;color:var(--muted);font-weight:600;line-height:1;margin-top:-.8mm}
.st .td.nj6{background:#FFF4E6}

/* cover */
.cover{background:var(--cream)}
.cover .band{position:absolute;left:0;right:0;top:0;height:112mm;background:var(--deep)}
.cover .band .k{position:absolute;left:12mm;top:44mm;font-family:'Montserrat',sans-serif;font-weight:800;font-size:8.4pt;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.cover .band h1{position:absolute;left:12mm;top:50mm;margin:0;font-family:'Montserrat',sans-serif;font-weight:800;font-size:34pt;line-height:1.02;color:#FAF6EE}
.cover .band .t{position:absolute;left:12mm;top:83mm;font-family:'Montserrat',sans-serif;font-weight:800;font-size:15pt;color:var(--gold)}
.cover .band .s{position:absolute;left:12mm;right:12mm;top:93mm;font-size:10.6pt;color:#D6E4DC;line-height:1.35}
.cover .band .arbig{position:absolute;right:12mm;top:10mm;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:40pt;line-height:1.6;direction:rtl;color:#1E5A47}
.cover .logo{position:absolute;left:12mm;top:12mm;height:13mm}
.cover .lower{position:absolute;left:12mm;right:12mm;top:120mm}
.cover .letters{display:flex;direction:rtl;justify-content:space-between;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:30pt;line-height:1.5}
.cover .toc{margin-top:3mm;border-top:.4mm solid var(--gold)}
.cover .toc div{display:flex;justify-content:space-between;padding:1.5mm 0;border-bottom:.3mm solid #E6DFCD;font-size:9.6pt}
.cover .toc b{color:var(--deep)}
.cover .toc .nw b{color:#8A6A0C}
.cover .foot{position:absolute;left:12mm;right:12mm;bottom:9mm;display:flex;justify-content:space-between;font-size:8.4pt;color:var(--muted)}

/* ================= INTERACTIVE LAYER (screen only) ================= */
.st .td{position:relative}
.nj{position:relative}
.hs{position:absolute;top:.7mm;right:.7mm;width:4.4mm;height:4.4mm;border-radius:50%;border:0;background:#C9A227;color:#fff;display:grid;place-items:center;cursor:pointer;z-index:6;padding:0;box-shadow:0 .3mm .9mm rgba(0,0,0,.28)}
.hs svg{width:3.1mm;height:3.1mm}
p.mx>.hs{position:relative;top:-.4mm;right:auto;display:inline-grid;vertical-align:middle;margin-right:1.6mm}
.nj>.hs{top:-1.6mm;right:-1.6mm;width:3.8mm;height:3.8mm}
@media screen{
  body{background:#E5E0D3;min-height:100vh}
  [data-x]{cursor:pointer;transition:box-shadow .15s}
  [data-x]:hover{box-shadow:inset 0 0 0 .6mm rgba(201,162,39,.75)}
  p.mx[data-x]:hover{box-shadow:none;background:rgba(201,162,39,.12);border-radius:1.5mm}
  body.nohs .hs{display:none}
  .tb{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 14px;background:#0B3D2E;color:#fff;font-family:'Source Sans 3',sans-serif;font-size:15px}
  .tbm{width:34px;height:34px;border-radius:10px;background:#098A46;display:grid;place-items:center;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:21px;padding-top:2px}
  .tbt{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;letter-spacing:.03em;line-height:1.1}
  .tbt small{display:block;font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:12px;letter-spacing:0;opacity:.75}
  .tbsp{flex:1}
  .tbb{font:inherit;font-weight:700;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px}
  .tbb:hover{background:rgba(255,255,255,.2)}
  .tbb.on{background:#C9A227;color:#0B3D2E}
  .tbb svg{width:18px;height:18px}
  .tbb.eq-snd{font-size:18px;padding:0 9px}
  .eq-snd.off{opacity:.55}
  #pSel{font:inherit;font-weight:700;height:38px;border-radius:10px;border:0;padding:0 10px;background:#FAF6EE;color:#0B3D2E;cursor:pointer}
  #book{display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 0 80px}
  /* pages are shrunk with transform (not zoom): iPhones shrank the boxes but kept the text big, so letters piled up */
  .pgw{width:calc(148mm * var(--z,1));height:calc(210mm * var(--z,1));flex:none;position:relative}
  .pgw>.page{position:absolute;left:0;top:0;transform:scale(var(--z,1));transform-origin:0 0}
  .page{box-shadow:0 3px 14px rgba(0,0,0,.18)}
}
@media screen and (max-width:700px){ .tbt{display:none} .tbb.wide span{display:none} }
@media print{
  .tb,.hs,.xm{display:none!important}
  #book{zoom:1!important;display:block;padding:0}
  .pgw{width:auto!important;height:auto!important}
  .pgw>.page{position:relative!important;transform:none!important}
  .page{box-shadow:none}
}

/* ---------- explainer pop-up ---------- */
.xm{position:fixed;inset:0;z-index:100;background:rgba(10,24,18,.66);display:flex;align-items:center;justify-content:center;padding:2vh 2vw;font-family:'Source Sans 3',sans-serif;color:#2B2A26}
.xm[hidden]{display:none}
.xcard{width:min(1200px,96vw);height:min(840px,95vh);background:#FAF6EE;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:xIn .25s ease}
@keyframes xIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.xhead{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 22px;background:#0B3D2E;color:#fff}
.xt{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(17px,2.1vw,25px);line-height:1.2}
.xt .xa{unicode-bidi:isolate;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:1.35em;color:#F2D57A}
.xsp{flex:1}
.xcount{font-weight:700;opacity:.75;font-size:15px;white-space:nowrap}
.xclose{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
.xclose:hover{background:rgba(255,255,255,.22)}
.xbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:14px 26px 10px}
.xfoot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid #E6DFCD;background:#fff}
.xctl{flex:1;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.xbtn{font:inherit;font-weight:700;font-size:16px;border:2px solid #E6DFCD;background:#fff;color:#0B3D2E;border-radius:12px;padding:9px 16px;cursor:pointer;white-space:nowrap}
.xbtn:hover{border-color:#cfc5ad}
.xbtn.pri{background:#098A46;border-color:#098A46;color:#fff}
.xbtn[disabled]{opacity:.35;pointer-events:none}
.xar{font-family:'Noto Naskh Arabic',serif;font-weight:700;direction:rtl;unicode-bidi:isolate}
.cap{font-size:clamp(17px,2.2vh,24px);text-align:center;color:#0B3D2E;line-height:1.4;margin:0}
.cap b{color:#0B3D2E}
.note{background:#FFF6DB;border:1px solid #F0DFA6;border-radius:12px;padding:8px 14px;font-size:clamp(15px,1.9vh,19px);color:#5E4A0E;text-align:center;align-self:center;max-width:900px}
.chipx{display:inline-block;color:#fff;font-weight:700;font-size:clamp(12px,1.6vh,15px);padding:2px 11px;border-radius:999px;font-family:'Source Sans 3',sans-serif}
.cS{background:#1C6FD1}.cM{background:#0E8A43}.cE{background:#D6336C}.cA{background:#7048E8}
.lgx{display:flex;direction:rtl;gap:6px;justify-content:center}

/* player (mini-lesson) */
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tab{font:inherit;border:0;background:#EFE8D8;border-radius:999px;padding:7px 15px;font-weight:700;font-size:15px;color:#6E6A60;cursor:pointer;position:relative;overflow:hidden}
.tab.on{background:#0B3D2E;color:#fff}
.tab .pb{position:absolute;left:0;bottom:0;height:4px;background:#C9A227;width:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.sc{animation:scIn .45s ease both;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh}
@keyframes scIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.meet{flex-direction:row;gap:5vw}
.mL{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(46vh,380px);line-height:1.3;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.mEn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:min(10vh,84px);color:#0B3D2E;line-height:1}
.mUr{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(7vh,58px);color:#6E6A60;direction:rtl;margin-top:1vh}
.mInfo{font-size:clamp(17px,2.4vh,24px);color:#0B3D2E;margin-top:1.4vh;font-weight:600}
.stack{position:relative;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(44vh,360px);line-height:1.4;width:1.3em;height:1.4em}
.stack .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stack .full{color:#C9A227;animation:dotFlash .7s ease-in-out infinite alternate}
.stack .skel{color:#0B3D2E}
@keyframes dotFlash{from{color:#C9A227}to{color:#E8590C}}
.famrow{display:flex;direction:rtl;gap:2.4vw;justify-content:center;flex-wrap:wrap}
.fc{direction:ltr;display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid #E6DFCD;border-radius:20px;padding:0 2vw 1.4vh;min-width:min(17vw,170px)}
.fc.on{border-color:#C9A227;box-shadow:0 0 0 5px rgba(201,162,39,.25);transform:translateY(-6px)}
.fc .fl{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(20vh,170px);line-height:1.45}
.fc b{font-family:'Montserrat',sans-serif;font-size:clamp(16px,2.2vh,22px);color:#0B3D2E}
.fc small{font-size:clamp(13px,1.7vh,16px);color:#6E6A60;font-weight:600;text-align:center;max-width:180px}
.shp{display:flex;direction:rtl;gap:1.6vw;justify-content:center}
.shc{background:#fff;border:2px solid #E6DFCD;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;min-width:min(19vw,200px);direction:ltr}
.shc .g{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(19vh,160px);line-height:1.55;display:flex;direction:rtl}
.shc .lbx{width:100%;text-align:center;color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(13px,1.9vh,18px);padding:.6vh 0;letter-spacing:.05em;text-transform:uppercase}
.shc .sub{font-size:clamp(12px,1.6vh,15px);color:#6E6A60;font-weight:700;padding:.4vh 0 .8vh;min-height:1.4em}
.shc.same{background:#FFF4E6}
.exl{display:flex;align-items:center;gap:14px;font-size:clamp(16px,2.2vh,22px);color:#0B3D2E}
.exl .xw2{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(9vh,76px);line-height:1.5;display:flex;direction:rtl}
.exl .dim{color:#C7BFAE}
.where{flex-direction:row;gap:3vw;align-items:center}
.where .dg{height:min(62vh,560px);aspect-ratio:600/520}
.where .dg svg{width:100%;height:100%}
.where .wt{max-width:380px;display:flex;flex-direction:column;gap:1.4vh}
.where .wl{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(16vh,130px);line-height:1.4;direction:rtl}
.where .wt p{margin:0;font-size:clamp(17px,2.4vh,24px);line-height:1.4}
.where .wt small{color:#6E6A60;font-weight:600}
.zring{fill:rgba(201,162,39,.35);stroke:#C9A227;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:zr 1.3s ease-out infinite}
@keyframes zr{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.8);opacity:0}}
.zglow{fill:rgba(255,214,102,.55);stroke:#C9A227;stroke-width:2.5;animation:zg 1.1s ease-in-out infinite alternate}
@keyframes zg{from{opacity:.35}to{opacity:1}}
.zlist{display:flex;flex-direction:column;gap:1.6vh;max-width:430px}
.zi{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #E6DFCD;border-radius:14px;padding:10px 14px}
.zi .n{flex:none;width:30px;height:30px;border-radius:50%;background:#C9A227;color:#fff;font-weight:800;display:grid;place-items:center;font-family:'Montserrat',sans-serif}
.zi .zl{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(7vh,54px);line-height:1.35;direction:rtl}
.zi p{margin:0;font-size:clamp(15px,2vh,20px);line-height:1.35}

/* word break-apart */
.wx{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}
.xw{display:flex;direction:rtl;justify-content:center;align-items:flex-start;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(24vh,200px);line-height:1.55;padding-bottom:min(21vh,190px)}
.xp{position:relative;display:flex;flex-direction:column;align-items:center;border-radius:22px;margin:0;padding:0;background:rgba(255,255,255,0);transition:margin .65s cubic-bezier(.2,.9,.3,1.25),padding .65s,background-color .45s,box-shadow .45s}
.xp .g{white-space:pre;display:block}
.xp .lb{position:absolute;top:100%;left:50%;transform:translate(-50%,-10px);opacity:0;transition:opacity .4s,transform .5s;display:flex;flex-direction:column;align-items:center;gap:3px;direction:ltr;white-space:nowrap;font-family:'Source Sans 3',sans-serif}
.xw.broken .xp{margin:0 min(1.6vw,20px);padding:0 .1em;background:#fff;box-shadow:0 4px 18px rgba(11,61,46,.13)}
.xw.broken .xp .lb{opacity:1;transform:translate(-50%,10px)}
.lb .iso{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(7vh,56px);line-height:1.25;color:#0B3D2E}
.lb b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(15px,2.3vh,23px);color:#0B3D2E}
.weq{opacity:0;transition:opacity .5s;text-align:center;display:flex;flex-direction:column;gap:.6vh;align-items:center}
.weq.on{opacity:1}
.xp.stp .g{text-shadow:0 0 0 transparent}
.xp.stp.bump{animation:xbump .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes xbump{40%{transform:scale(1.12)}}
.note.stopn{background:#F1ECFF;border-color:#D6CBFA;color:#3B2A80}
.xbtn.stopon{background:#C92A2A!important;border-color:#C92A2A!important;color:#fff!important}
.weq .eqA{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(6.5vh,52px);direction:rtl;line-height:1.4}
.weq .eqA i{font-style:normal;color:#C9A227;font-family:'Montserrat',sans-serif;font-weight:800;margin:0 .25em;font-size:.7em}
.weq .eqE{font-size:clamp(17px,2.4vh,24px);font-weight:700;color:#0B3D2E}

/* sign (harakat) */
.hx{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4vw}
.hbig{position:relative;width:min(48vh,400px);height:min(58vh,470px);background:#fff;border:2px solid #E6DFCD;border-radius:28px}
.hbig .hg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(34vh,280px);line-height:1}
.hbig .hg.base{color:#1F1E1B}
.htag{position:absolute;left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:clamp(14px,1.9vh,18px);padding:5px 14px;border-radius:999px;white-space:nowrap;animation:tagIn .6s .3s cubic-bezier(.2,1.4,.4,1) both}
.htag.top{top:-18px}.htag.bot{bottom:-18px}
@keyframes tagIn{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.hinfo{display:flex;flex-direction:column;gap:2vh;max-width:460px}
.hsnd{font-size:clamp(22px,4vh,40px);color:#0B3D2E;font-weight:700}
.hsnd b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.5em;color:#098A46}
.h3{display:flex;direction:rtl;gap:12px}
.h3 .t{position:relative;width:min(13vh,110px);height:min(15vh,128px);background:#fff;border:3px solid #E6DFCD;border-radius:16px}
.h3 .t.on{border-color:#C9A227;box-shadow:0 0 0 4px rgba(201,162,39,.25)}
.h3 .t span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(8vh,66px)}
.h3 .t small{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-weight:700;color:#6E6A60;font-size:13px}
.rule{background:#fff;border:1px solid #E6DFCD;border-left:5px solid #C9A227;border-radius:10px;padding:8px 12px;font-size:clamp(15px,2vh,19px);line-height:1.35}
.vid{max-width:100%;max-height:100%;border-radius:16px;background:#000}

.vframe{width:100%;height:100%;border:0;border-radius:14px;background:#0d1012}

/* beginner letter card (page 3) */
.tab .tn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.1);font-size:13px;margin-right:7px}
.tab.on .tn{background:#C9A227;color:#0B3D2E}
.bx .bxT{max-width:620px}
.memo{margin-top:2.4vh;font-size:clamp(20px,3vh,32px);font-weight:700;color:#0B3D2E;background:#FFF7DE;border:2px solid #EBD9A0;border-radius:18px;padding:12px 20px;line-height:1.3}
.dotsline{margin-top:1.4vh;font-size:clamp(16px,2.2vh,22px);color:#6E6A60;font-weight:600}
.trace{gap:1.4vh}
.tw{position:relative;width:min(80vw,1000px);height:min(58vh,560px);background:#fff;border:3px dashed #E0D6BE;border-radius:24px;touch-action:none;overflow:hidden}
.tGhost-old{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(44vh,430px);line-height:1.4;color:rgba(11,61,46,.06);-webkit-text-stroke:3px #D3C8AE;pointer-events:none;user-select:none}
.tc{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.trow{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.find{gap:2.4vh}
.fq{font-size:clamp(22px,3.4vh,36px);font-weight:700;color:#0B3D2E;margin:0;text-align:center}
.fq b{color:#098A46}
.fbtn{cursor:pointer;font:inherit;position:relative;transition:transform .15s}
.fbtn:hover{transform:translateY(-4px)}
.fbtn .fl{color:#0B3D2E}
.fbtn.ok{border-color:#2FB36B;box-shadow:0 0 0 6px rgba(47,179,107,.25)}
.fbtn.ok::after{content:"✓";position:absolute;top:-16px;right:-16px;width:44px;height:44px;border-radius:50%;background:#2FB36B;color:#fff;font:800 26px/44px 'Montserrat',sans-serif}
.fbtn.no{border-color:#E5484D;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.fres{min-height:1.5em;font-weight:700}
.fres.good{color:#098A46}
.fres.bad{color:#C2410C}

.tg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tprog{display:flex;align-items:center;gap:10px}
.tbar{width:min(26vw,260px);height:16px;border-radius:999px;background:#EFE8D8;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:#C9A227;border-radius:999px;transition:width .25s,background .25s}
.tpct{font-family:'Montserrat',sans-serif;font-size:clamp(16px,2.2vh,22px);color:#0B3D2E;min-width:5.5em}
.tdots{font-size:clamp(15px,2vh,20px);color:#6E6A60;font-weight:600}
.tdots b{color:#0B3D2E}
.tmsg{font-size:clamp(15px,2vh,20px);color:#0B3D2E;min-width:16em}
.yay{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:5;text-align:center;background:rgba(255,255,255,.95);border:5px solid #C9A227;border-radius:30px;padding:16px 50px 22px;box-shadow:0 24px 70px rgba(0,0,0,.25);animation:yayIn .55s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none}
.yay.out{opacity:0;transition:opacity .5s}
.yAr{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:min(11vh,100px);color:#098A46;line-height:1.35;direction:rtl}
.yEn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:min(6vh,54px);color:#C9A227}
@keyframes yayIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:99999}

/* ================= new look (Nov 2026): calm, modern chrome around the book ================= */
@media screen{
  body{background:#E8ECE9}
  .tb{gap:8px;padding:9px 16px;background:#0C3B2C;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.08)}
  .tbm{width:36px;height:36px;border-radius:11px;background:#12A05C}
  .tbt{font-family:'Source Sans 3',sans-serif;font-weight:800;font-size:17px;letter-spacing:0}
  .tbt small{font-weight:600;font-size:12.5px;opacity:.7}
  .tbb{font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:11px;height:40px;transition:background .15s,border-color .15s}
  .tbb:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.24)}
  .tbb.on{background:rgba(242,213,122,.16);border-color:rgba(242,213,122,.5);color:#F6DE92}
  .tbb svg{width:19px;height:19px}
  .tbb.eq-snd{padding:0 10px}
  .eq-snd.off{opacity:.6}
  #pSel{height:40px;border-radius:11px;background:#fff;color:#14231D;font-weight:700;padding:0 12px}
  #book{gap:26px}
  .page{box-shadow:0 1px 2px rgba(16,40,30,.08),0 12px 32px rgba(16,40,30,.12);border-radius:3px}
}
.xm{background:rgba(9,22,17,.55);backdrop-filter:blur(3px)}
.xcard{background:#F3F6F4;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.xhead{background:#fff;color:#14231D;border-bottom:1px solid #E1E7E3;padding:10px 14px 10px 20px}
.xt{font-family:'Source Sans 3',sans-serif;font-weight:800;color:#14231D}
.xt .xa{color:#0B6B45}
.xcount{color:#5F6D67;opacity:1;font-weight:600;background:#EEF2EF;border-radius:999px;padding:4px 12px;font-size:14px}
.xclose{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #E1E7E3;color:#14231D;display:grid;place-items:center;padding:0}
.xclose:hover{background:#F4F6F5}
.xclose svg,.xbtn svg{width:19px;height:19px}
.xfoot{background:#fff;border-top:1px solid #E1E7E3}
.xbtn{font-weight:700;border:1px solid #E1E7E3;border-radius:12px;color:#14231D;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(16,40,30,.05)}
.xbtn:hover{border-color:#C9D3CD}
.xbtn.pri{background:#0B6B45;border-color:#0B6B45;color:#fff}
.xbtn.pri:hover{background:#095A3A}
.tabs{gap:4px;background:#E6ECE8;border-radius:999px;padding:4px;align-self:center}
.tab{background:transparent;color:#5F6D67;font-weight:600;padding:7px 15px}
.tab:hover{color:#14231D}
.tab.on{background:#fff;color:#0B6B45;box-shadow:0 1px 3px rgba(16,40,30,.15)}
.tab .pb{background:#C9A227;height:3px}
.tab .tn{background:#E1E7E3;color:#5F6D67}
.tab.on .tn{background:#0B6B45;color:#fff}
.fc,.shc,.h3 .t,.hbig,.zi{border-width:1px;border-color:#E1E7E3;box-shadow:0 1px 2px rgba(16,40,30,.05),0 8px 22px rgba(16,40,30,.06)}
.mEn,.fc b,.lb b,.weq .eqA i,.hsnd b,.tpct,.zi .n{font-family:'Source Sans 3',sans-serif}
.shc .lbx{font-family:'Source Sans 3',sans-serif;letter-spacing:.06em}
.yay{border:0;border-radius:28px;box-shadow:0 30px 80px rgba(11,61,46,.3)}
.yEn{font-family:'Source Sans 3',sans-serif;color:#B48A12}
.memo{background:#FFF8E3;border:1px solid #F0E0A8}
.note{border-radius:14px}

/* ================= phones and small tablets ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.page,.page *{-webkit-text-size-adjust:none;text-size-adjust:none}
button{touch-action:manipulation}
@media screen and (max-width:1000px){
  .tbt{display:none}
  .tbb.wide:not(#pzOpen) span{display:none}
  .tbb.wide:not(#pzOpen){padding:0 10px}
}
@media screen and (max-width:700px){
  .tb{gap:6px;padding:8px 10px}
  .tbm{width:34px;height:34px}
  .tbb{height:38px;min-width:38px;padding:0 9px}
  #pSel{height:38px;padding:0 6px;max-width:112px}
  #fitBtn,#fsBtn{display:none}
  #pzOpen{white-space:nowrap;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;height:52px;padding:0 22px;border-radius:999px;font-size:16.5px;font-weight:700;gap:9px;box-shadow:0 10px 26px rgba(11,61,46,.35)}
  #pzOpen span{display:inline}
  #book{gap:14px;padding:10px 0 96px}
  /* help boxes become full screen */
  .xm{padding:0}
  .xcard{width:100vw;height:100vh;height:100dvh;border-radius:0}
  .xhead{padding:8px 8px 8px 14px;gap:8px}
  .xt{font-size:19px}
  .xcount{font-size:12.5px;padding:3px 9px}
  .xbody{padding:10px 10px 6px}
  .xfoot{padding:8px;gap:6px}
  .xctl{gap:6px}
  .xbtn{padding:9px 11px;font-size:15px}
  #xNext span,#xPrev span{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;white-space:nowrap;padding:7px 12px;font-size:14px}
  .sc{gap:1.4vh}
  .meet{flex-direction:column;gap:1.5vh;text-align:center}
  .mL{font-size:min(40vw,34vh)}
  .mEn{font-size:min(12vw,7vh)}
  .mUr{font-size:min(9vw,5vh)}
  .mInfo{font-size:16px}
  .stack{font-size:min(46vw,36vh)}
  .famrow{gap:2.5vw}
  .fc{min-width:0;padding:0 3vw 1vh;border-radius:16px}
  .fc .fl{font-size:min(20vw,15vh)}
  .fc small{max-width:28vw;font-size:12px}
  .shp{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:rtl;width:100%}
  .shc{min-width:0}
  .shc .g{font-size:min(19vw,12vh)}
  .shc .lbx{font-size:12px}
  .shc .sub{font-size:11px}
  .exl{flex-wrap:wrap;justify-content:center;gap:6px 10px;font-size:15px;text-align:center}
  .exl .xw2{font-size:min(14vw,8vh)}
  .cap{font-size:clamp(15px,4.4vw,19px)}
  .note{font-size:14px}
  .where{flex-direction:column;gap:1.5vh}
  .where .dg{width:100%;height:auto;max-height:44vh}
  .where .wt{max-width:none;align-items:center;text-align:center}
  .where .wl{font-size:min(20vw,9vh)}
  .zlist{max-width:none;gap:1vh}
  .xw{font-size:min(17vw,13vh);padding-bottom:min(18vh,140px)}
  .lb .iso{font-size:min(9vw,5vh)}
  .lb b{font-size:13px}
  .hx{flex-direction:column;gap:2vh}
  .hbig{width:min(58vw,34vh);height:min(70vw,40vh)}
  .hbig .hg{font-size:min(42vw,24vh)}
  .hinfo{max-width:none;align-items:center;text-align:center;gap:1.4vh}
  .hsnd{font-size:clamp(18px,5.5vw,26px)}
  .h3 .t{width:min(17vw,11vh);height:min(20vw,13vh)}
  .h3 .t span{font-size:min(10vw,6vh)}
  .rule{font-size:14px}
  .tw{width:94vw;height:min(52vh,96vw)}
  .tbar{width:34vw}
  .tmsg{min-width:0;text-align:center}
  .memo{font-size:clamp(16px,4.8vw,22px);padding:10px 14px}
  .bx .bxT{max-width:none}
  .fq{font-size:clamp(19px,5.6vw,26px)}
  .yay{padding:10px 22px 14px;max-width:92vw}
  .yAr{font-size:min(15vw,9vh)}
  .yEn{font-size:min(7vw,5vh)}
}
@media screen and (max-width:420px){
  .xctl .xbtn:not(.pri) span{display:none}
}
/* phones held sideways: very little height */

function analyze(w){
  const ps=[]; for(const c of w){ if(MARKS.test(c)){ if(ps.length) ps[ps.length-1].m+=c; continue; } const k=CH[c]; if(!k) continue; ps.push({ch:c,m:"",id:k.id,j:k.j}); }
  ps.forEach((p,i)=>{ const a=ps[i-1], b=ps[i+1]; p.jp=!!a&&a.j==="D"&&p.j!=="U"; p.jn=!!b&&p.j==="D"&&b.j!=="U"; p.form=p.jp?(p.jn?"M":"E"):(p.jn?"S":"A"); });
  return ps;
}

/* a word with each letter in its own colour (lam-alif kept as one ligature) */
function colourWord(w,colors){
  const ps=analyze(w), out=[];
  for(let i=0;i<ps.length;i++){
    const p=ps[i], n=ps[i+1], col=colors?colors(i,p):CYC[i%3];
    if(p.id==="lam"&&n&&n.ch==="ا"&&p.jn){ out.push(`<span style="color:${col}">${(p.jp?ZWJ:"")+p.ch+p.m+n.ch+n.m}</span>`); i++; }
    else out.push(`<span style="color:${col}">${ptxt(p)}</span>`);
  }
  return out.join("");
}

function formHTML(id,form,col){
  const l=L[id]; const c=col||SC[form];
  if(l.j==="U") return `<span style="color:${c}">${l.ch}</span>`;
  const jp=form==="M"||form==="E", jn=(form==="S"||form==="M")&&l.j==="D";
  const hand=`<span class="hand">${ZWJ}${TAT}${ZWJ}</span>`;

}
function dimWord(w,idx){

const BOOKWORDS=("لج بلب كت كا كل بكت تكث ثا بس یس نص تض ثط ثج تح نخ یخ بج یم بم نم تم ثم بی یی تی ثی نبل بنل تنل یتل یثل بنن ینن تین یثن بثن حث خب جت تحت یجب بخت نه ههه یهب بها بهم جد خذ جر خز یر تز سل شل ظا صب طب ضا عج غح بع یغ بعد بغذ فو قو نقر یفر یف فیه منه "+

      if(c===id){ b.classList.add("ok"); res.className="cap fres good"; res.innerHTML=`MashaAllah! ⭐ That is <b>${l.en}</b>.`; celebrate(stg); }
      else { void b.offsetWidth; b.classList.add("no"); if(window.EQSfx) EQSfx.no(); res.className="cap fres bad"; res.innerHTML=`Try again. That one is <b>${L[c].en}</b>.`; } });
    stg.querySelector(".fagain").onclick=find;
  };
  const back=ctlBtn(XI.back+"Back",()=>go(cur-1)), next=ctlBtn("Next step"+XI.fwd,()=>go(cur+1),true);
  const go=i=>{ if(i<0||i>2) return; cur=i; tabs.forEach((t,j)=>t.classList.toggle("on",j===i)); back.disabled=i===0; next.disabled=i===2; [meet,trace,find][i](); };
  tabs.forEach((t,j)=>t.onclick=()=>go(j));
  X.space=()=>go(Math.min(2,cur+1));
  go(0);
}
function singleX(t){
  const ch=[...t].find(c=>CH[c]); const id=CH[ch].id;
  const NOTE={"ک":"<b>ک</b> is Kaaf written another way (as in Urdu) — it is the same letter.","ڪ":"<b>ڪ</b> is Kaaf in a decorative shape — it is the same letter.","ة":"<b>ة</b> is Round Ta — it only comes at the end of a word.","أ":"Hamza sitting on an Alif “chair”.","ؤ":"Hamza sitting on a Waaw “chair”.","ئ":"Hamza sitting on a Yaa “chair”."};
  let note=NOTE[ch];
  if(!note&&t.includes(ZWJ)) note=`Here ${L[id].en} is in its <b>end</b> shape.`;
  if(!note&&t.includes(TAT)) note=`Here ${L[id].en} is in its <b>start</b> shape.`;
  letterX(id,"Shapes",note);
}
function player(S,start){
  xBody.innerHTML=`<div class="tabs">${S.map((s,i)=>`<button class="tab" data-i="${i}">${s.t}<span class="pb"></span></button>`).join("")}</div><div class="stage" id="stg"></div>`;
  const tabs=[...xBody.querySelectorAll(".tab")], stg=document.getElementById("stg");
  let cur=start, playing=!S[start].video;
  const DUR=3000;
  const pbtn=ctlBtn("",()=>{ playing=!playing; if(playing&&cur>=S.length-1) cur=0; go(cur,true); },true);
  ctlBtn(XI.again+"<span>From the start</span>",()=>{ playing=true; go(0,true); });
  const go=(i,fresh)=>{
    stopTimers(); cur=i;
    tabs.forEach((t,j)=>{ t.classList.toggle("on",j===i); const pb=t.querySelector(".pb"); pb.style.transition="none"; pb.style.width=j<i?"100%":"0"; });
    if(fresh!==false) stg.innerHTML=S[i].h;
    pbtn.innerHTML=playing?XI.pause+"Pause":XI.play+"Play";
    if(playing&&!S[i].video){
      const pb=tabs[i].querySelector(".pb"); void pb.offsetWidth; pb.style.transition=`width ${DUR}ms linear`; pb.style.width="100%";
      const my=X.tok; X.timer=setTimeout(()=>{ if(my!==X.tok) return; if(i<S.length-1&&!S[i+1].video) go(i+1); else { playing=false; pbtn.innerHTML=XI.play+"Play"; } },DUR);
    }
  };
  tabs.forEach((t,j)=>t.onclick=()=>{ playing=false; go(j); });
  X.space=()=>pbtn.click();
  go(start);
}

/* ---------- 2. word / compound / exercise word: break into letters ---------- */
function wordX(w,sounds){
  const ps0=analyze(w), lastH=harakaOfX(ps0[ps0.length-1]); let broken=false, stop=false;
  const draw=()=>{
    const ps=stop?ps0.map((p,i)=>i===ps0.length-1?Object.assign({},p,{m:"ْ",stopped:true}):p):ps0, ws=ps.map(p=>p.ch+p.m).join("");
    setTitle(`<bdi class="xa">${w}</bdi>${stop?` → <bdi class="xa">${ws}</bdi> &nbsp;stopping`:` &nbsp;${sounds?`${ps.length} sounds`:`${ps.length} letters joined`}`}`);
    const col=p=>p.stopped?"var(--hs)":sounds?(HC[harakaOfX(p)]||"#2B2A26"):SC[p.form];
    const syl=p=>p.stopped?((p.id==="alif"||p.id==="hamza")?"'":SND[p.id]):sylOf(p);
    const chip=p=>p.stopped?`<span class="chipx" style="background:var(--hs)">Sukun</span>`:harakaOfX(p)?`<span class="chipx" style="background:${HC[harakaOfX(p)]}">${HN[harakaOfX(p)]}</span>`:"";
    const piece=p=>`<div class="xp${p.stopped?" stp":""}"><span class="g" style="color:${col(p)}">${ptxt(p)}</span><div class="lb"><span class="iso">${sounds?p.ch+p.m:isoOf(p)}</span><b>${sounds?syl(p):nameOf(p)}</b>${sounds?chip(p):`<span class="chipx c${p.form}">${FORMN[p.form]}</span>`}</div></div>`;
    let why=[];
    if(!sounds){
      ps.forEach((p,i)=>{ const n=ps[i+1]; if(n&&p.j==="R") why.push(`${nameOf(p)} never holds hands with the next letter, so ${nameOf(n)} starts again.`); });
      if(ps.some(p=>p.id==="hamza")) why.push("Hamza never joins any letter.");
      if(/لا/.test(w)) why.push("Laam + Alif are written together like this: لا");
    }
    const sy=ps.map(syl); if(stop&&sy.length>1) sy[sy.length-2]+=sy.pop();
    const eqA=ps.map(p=>`<span style="color:${col(p)}">${sounds?p.ch+p.m:isoOf(p)}</span>`).join("<i>+</i>")+"<i>=</i>"+`<span>${sounds?ws:w}</span>`;
    const eqE=sounds?`${sy.join(" + ")} = <span style="color:#098A46">${sy.join("")}</span>${stop?"":" — now read the whole word."}`:ps.map(nameOf).join(" + ");
    if(stop) why.push(`<b>Stopping (Waqf):</b> the last letter rests. Its ${HN[lastH]} is dropped: <span class="xar">${w}</span> → <span class="xar" style="color:var(--hs)">${ws}</span>`);
    xBody.innerHTML=`${sounds?`<div class="lgx"><span class="chipx" style="background:var(--hf)">Fatha</span><span class="chipx" style="background:var(--hk)">Kasra</span><span class="chipx" style="background:var(--hd)">Damma</span>${stop?`<span class="chipx" style="background:var(--hs)">Sukun</span>`:""}</div>`
       :`<div class="lgx"><span class="chipx cA">Alone</span><span class="chipx cS">Start</span><span class="chipx cM">Middle</span><span class="chipx cE">End</span></div>`}
      <div class="wx"><div class="xw" id="xw">${ps.map(piece).join("")}</div>
      <div class="weq" id="weq"><div class="eqA">${eqA}</div><div class="eqE">${eqE}</div>${why.map(t=>`<div class="note${stop?" stopn":""}">${t}</div>`).join("")}</div></div>`;
  };
  const tb=ctlBtn(XI.cut+"Break it",()=>set(!broken),true);
  ctlBtn(XI.again+"<span>Play again</span>",()=>{ set(false); run(); });
  if(sounds&&ps0.length>1&&lastH){ const sb=ctlBtn("",()=>{ stop=!stop; if(window.EQSfx) EQSfx.stop(); lab(); draw(); set(broken); if(stop){ const g=document.querySelector("#xw .xp.stp"); if(g) g.classList.add("bump"); } });
    const lab=()=>{ sb.innerHTML=stop?XI.play+"Read on":XI.stop+"Stop here (Waqf)"; sb.classList.toggle("stopon",stop); }; lab(); }
  const set=b=>{ broken=b; const xw=document.getElementById("xw"), weq=document.getElementById("weq"); xw.classList.toggle("broken",b); weq.classList.toggle("on",b); tb.innerHTML=b?XI.join+"Join it":XI.cut+"Break it"; };
  const run=()=>{ stopTimers(); const my=X.tok; X.timer=setTimeout(()=>{ if(my===X.tok){ set(true); if(window.EQSfx) EQSfx.swish(); } },900); };
  X.space=()=>tb.click();
  draw();
  if(ps0.length>1) run(); else set(true);
}

/* ---------- 3. letter with a sign (pages 13–14) ---------- */
function harakaX(id,h){
  const base=id==="alif"?"ا":L[id].ch, s=(id==="alif"||id==="hamza"?"":SND[id])+HV[h];
  setTitle(`<bdi class="xa">${base+HM[h]}</bdi> &nbsp;${L[id].en} + ${HN[h]}`);
  const rules=[];
  if(id==="alif") rules.push("<b>Alif with a sign is read as Hamza:</b> <span class='xar'>اَ اِ اُ</span> = a · i · u");
  if(id==="ra") rules.push(h==="kasra"?"<b>Ra with Kasra is thin</b> — read it softly.":"<b>Ra with Fatha or Damma is heavy</b> — read it with a full mouth.");
  if(HEAVYX.has(id)) rules.push("<b>Heavy letter</b> — always read with the mouth full.");
  rules.push(`<b>Don’t drag the sound:</b> say «${s}», not «${s}${HV[h].repeat(3)}».`);
  xBody.innerHTML=`<div class="hx">
    <div class="hbig"><span class="hg" style="color:${HC[h]}">${base+HM[h]}</span><span class="hg base">${base}</span><div class="htag ${h==="kasra"?"bot":"top"}" style="background:${HC[h]}">${HN[h]} — ${HW[h]}</div></div>
    <div class="hinfo"><div class="hsnd"><span class="xar" style="font-size:1.4em">${base+HM[h]}</span> = <b>${s}</b></div>
      <div class="h3">${["fatha","kasra","damma"].map(x=>`<div class="t ${x===h?"on":""}"><span style="color:${HC[x]}">${base+HM[x]}</span><span style="color:#1F1E1B">${base}</span><small>${(id==="alif"||id==="hamza"?"":SND[id])+HV[x]}</small></div>`).join("")}</div>
      ${rules.map(r=>`<div class="rule">${r}</div>`).join("")}</div></div>`;
}

/* ---------- 4. makharij (pages 4–6) ---------- */
function makhrajX(zs){
  const letters=zs.flatMap(z=>ZONE_LETTERS[z]||[]);
  setTitle(`<bdi class="xa">${letters.map(id=>L[id].ch).join(" ")}</bdi> &nbsp;Where the sound comes from`);
  const S=zs.map(z=>({t:`<span class="xar" style="font-size:1.2em">${(ZONE_LETTERS[z]||[]).map(id=>L[id].ch).join(" ")}</span>`,video:true,
    h:`<div class="sc"><iframe class="vframe" src="makharij-player.html?z=${z}&embed=1" title="Makhraj" allow="autoplay; fullscreen"></iframe></div>`}));
  player(S,0);
}

let fitMode="page";
const PW=148*96/25.4, PH=210*96/25.4;
function fit(){
  const tb=document.querySelector(".tb").offsetHeight;

}
function goPage(i){ i=Math.max(0,Math.min(PAGES.length-1,i)); if(i!==curPage()&&window.EQSfx) EQSfx.page(); const tb=document.querySelector(".tb").offsetHeight; scrollTo({top:PAGES[i].getBoundingClientRect().top+scrollY-tb-12,behavior:"smooth"}); pSel.value=i; }
function curPage(){ let c=0; PAGES.forEach((p,i)=>{ if(p.getBoundingClientRect().top<innerHeight*.5) c=i; }); return c; }

document.getElementById("sndBtn").onclick=()=>{ if(!window.EQSfx) return; EQSfx.on=!EQSfx.on; if(EQSfx.on) EQSfx.yay(); };
document.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!window.EQSfx||b.closest(".pz")||b.matches("#pPrev,#pNext,#sndBtn,#pzOpen,.fbtn")) return; EQSfx.tap(); },true);

addEventListener("keydown",e=>{
  if(!xm.hidden){
    if(e.key==="Escape") closeX();
    else if(e.key==="ArrowLeft"){ e.preventDefault(); moveX(1); }

});
